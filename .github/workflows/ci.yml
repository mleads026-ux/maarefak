name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - chatgpt/lammetna-production-hardeni

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Configure public build environment
        run: cp .env.example .env.local
      - name: Build
        run: npm run build
