name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - chatgpt/lammetna-production-hardeni

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Configure public build environment
        run: cp .env.example .env.local
      - name: Build
        run: npm run build

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/lammetna-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/lammetna-next.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/login >/dev/null
          curl -fsS http://127.0.0.1:3000/signup >/dev/null

          curl -fsSI http://127.0.0.1:3000/manifest.webmanifest             | tr -d '\r'             | grep -qi '^content-type: application/manifest+json'

          HOME_HEADERS="$(curl -fsSI http://127.0.0.1:3000/home | tr -d '\r')"
          echo "$HOME_HEADERS" | grep -qi '^location: /login'
          echo "$HOME_HEADERS" | grep -qi '^content-security-policy:'
          echo "$HOME_HEADERS" | grep -qi '^x-frame-options: DENY'
          echo "$HOME_HEADERS" | grep -qi '^x-content-type-options: nosniff'

          kill "$APP_PID"
          wait "$APP_PID" || true
