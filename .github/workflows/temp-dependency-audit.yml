name: Temporary dependency audit

on:
  push:
    branches:
      - chatgpt/lammetna-production-hardeni
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts
      - name: Run audit
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('AUDIT_SUMMARY', JSON.stringify(j.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(j.vulnerabilities || {})) {
            console.log('AUDIT_VULN', name, 'severity='+v.severity, 'direct='+v.isDirect, 'fix='+JSON.stringify(v.fixAvailable), 'via='+JSON.stringify(v.via));
          }
          NODE
