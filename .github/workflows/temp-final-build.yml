name: Temporary final branch build

on:
  push:
    branches:
      - chatgpt/lammetna-production-hardeni

jobs:
  build:
    if: ${{ github.event.head_commit.message == 'Add temporary final branch build' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      - run: npm run build
