name: Temporary final hardening build

on:
  push:
    branches:
      - chatgpt/lammetna-production-hardeni

jobs:
  build:
    if: ${{ github.event.head_commit.message == 'Verify complete hardening build Node24' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      - run: npm run build
