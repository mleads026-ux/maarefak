name: Temporary Node 24 build verification

on:
  push:
    branches:
      - chatgpt/lammetna-production-hardeni

jobs:
  build:
    if: ${{ github.event.head_commit.message == 'Verify build on Vercel Node 24' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Configure public build env
        run: cp .env.example .env.local
      - name: Build
        run: npm run build

# final security-header verification
