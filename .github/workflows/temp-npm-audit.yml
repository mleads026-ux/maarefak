name: Temporary npm audit

on:
  push:
    branches:
      - chatgpt/lammetna-production-hardeni

jobs:
  audit:
    if: ${{ github.event.head_commit.message == 'Test braces override without Tailwind major' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply conservative transitive override in runner only
        run: |
          npm pkg set overrides.braces=3.0.4
          npm install --package-lock-only --ignore-scripts
      - name: Audit overridden dependency graph
        shell: bash
        run: |
          npm audit --json > audit-overrides.json || true
          node -e "const a=require('./audit-overrides.json'); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))"
      - name: Verify install and build with override
        run: |
          npm ci
          cp .env.example .env.local
          npm run build
