name: Temporary npm audit

on:
  push:
    branches:
      - chatgpt/lammetna-production-hardeni

jobs:
  audit:
    if: ${{ github.event.head_commit.message == 'Verify npm audit release gate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Full dependency audit
        shell: bash
        run: |
          npm audit --json > audit-full.json || true
          node -e "const a=require('./audit-full.json'); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))"
      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node -e "const a=require('./audit-prod.json'); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))"
